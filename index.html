<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumuni Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.13/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/391c3b7315.js" crossorigin="anonymous"></script>
</head>

<body class="bg-[#F0F2F5]">
    <header class="bg-white sticky top-0 z-10">
        <nav class="w-10/12 mx-auto ">
            <div class="navbar flex justify-between bg-base-100 p-0">
                <div class="">
                    <a href="index.html" class="btn btn-ghost p-0 text-xl">Alumni Portal</a>
                </div>
                <div class=" text-2xl hidden ">
                    <a href="index.html"><i class="fa-solid fa-house fa-fw cursor-pointer  hover:bg-slate-100"></i></a>
                    <a href="friend.html"><i class="fa-solid fa-user-group cursor-pointer hover:bg-slate-100"></i></a>
                    <a href="event.html"><i class="fa-solid fa-calendar-days cursor-pointer hover:bg-slate-100"></i></a>
                    <i class="fa-solid fa-droplet"></i>
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="flex-none gap-2">
                    <div class="dropdown dropdown-end">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                            <div class="w-10 rounded-full">
                                <img alt="Tailwind CSS Navbar component"
                                    src="https://i.ibb.co.com/p3dG5zd/1711777420684.jpg">
                            </div>
                        </div>
                        <ul tabindex="0"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow">
                            <li>
                                <a class="justify-between">
                                    Profile
                                    <span class="badge">New</span>
                                </a>
                            </li>
                            <li><a>Settings</a></li>
                            <li><a>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="w-10/12 mx-auto  ">
        <section id="friends-container" class="py-10">
            <div>
                <h1 class="text-2xl md:text-5xl">Alumuni Friends</h1>
            </div>

            <div class="flex py-6 text-black">
                <input id="search-input" type="text" placeholder="Search" class="input input-bordered rounded-none w-full" />
                <button class="p-3 border-none bg-[#0d6efd] shadow-xl text-white hover:bg-[#0b5ed7]"><i
                        class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </section>

        <section id="card-container" class="flex flex-wrap flex-col md:flex-row">
           

        </section>
    </main>
    <script src="scripts/friends.js"></script>
</body>

</html>
